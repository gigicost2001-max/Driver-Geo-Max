<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Driver Geo Max - Professional</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- CSP Sicurezza Migliorata -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://unpkg.com;
        img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com https://firebasestorage.googleapis.com;
        connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com 
                    https://*.firebasedatabase.app wss://*.firebasedatabase.app 
                    https://www.gstatic.com https://*.googleapis.com 
                    https://nominatim.openstreetmap.org https://router.project-osrm.org;
        font-src 'self' https://fonts.gstatic.com;
    ">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        :root {
            --primary-color: #007bff;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --dark-color: #343a40;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --border-radius: 8px;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; }

        body, html {
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color), #0056b3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .app-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--gray-color);
            transition: all 0.3s ease;
        }

        .status-dot.online { background-color: var(--success-color); }
        .status-dot.offline { background-color: var(--gray-color); }

        #map { width: 100%; height: 100%; z-index: 1; }

        #cerchiaBadge {
            position: absolute;
            bottom: 30px;
            left: 15px;
            z-index: 1000;
            background: rgba(108, 117, 125, 0.95);
            color: white;
            border-radius: 20px;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 200px;
            word-wrap: break-word;
        }

        #searchContainer {
            position: absolute;
            top: 75px;
            left: 15px;
            right: 15px;
            z-index: 1000;
        }

        #searchInput {
            width: 100%;
            padding: 15px 20px;
            border-radius: 25px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.95);
            box-shadow: var(--shadow);
            font-size: 16px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        #searchResults {
            list-style: none;
            margin: 10px 0 0 0;
            padding: 0;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            max-height: 300px;
            overflow-y: auto;
            display: none;
            position: absolute;
            width: 100%;
            z-index: 1001;
        }

        #searchResults li {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #searchResults li:last-child { border-bottom: none; }
        #searchResults li:hover { background: var(--light-color); }

        #cancelNavBtn {
            display: none;
            margin-top: 10px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: var(--border-radius);
            background: var(--danger-color);
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        #menuToggleBtn {
            position: absolute;
            top: 75px;
            right: 15px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            border: 2px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        #menuToggleBtn:active { transform: scale(0.95); background: white; }

        .control-panel {
            position: absolute;
            top: 140px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: calc(100% - 60px);
            max-width: 320px;
            transform: translateY(-15px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }

        .control-panel.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .control-btn {
            padding: 16px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 16px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            min-height: 50px;
        }

        .control-btn:active { transform: scale(0.98); filter: brightness(0.9); }

        .btn-record { background-color: var(--primary-color); }
        .btn-stop { background-color: var(--danger-color); }
        .btn-note { background-color: var(--warning-color); color: var(--dark-color); }
        .btn-block { background-color: #fd7e14; }
        .btn-archive { background-color: var(--gray-color); }
        .btn-sync { background-color: var(--success-color); }

        #cancelBlockBtn {
            background: white;
            border: 2px solid var(--danger-color);
            border-radius: var(--border-radius);
            padding: 12px;
            font-size: 14px;
            color: var(--danger-color);
            font-weight: 600;
            cursor: pointer;
            display: none;
            text-align: center;
            transition: all 0.3s ease;
            width: 100%;
        }

        #cancelBlockBtn:hover {
            background: var(--danger-color);
            color: white;
        }

        #toastMsg {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            z-index: 2000;
            font-size: 15px;
            text-align: center;
            transition: bottom 0.4s ease;
            white-space: nowrap;
            font-weight: 600;
            max-width: 90%;
            word-wrap: break-word;
            backdrop-filter: blur(10px);
        }

        #toastMsg.show { bottom: 100px; }
        #toastMsg.alert { 
            background: var(--danger-color); 
            border: 2px solid white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin: 0;
            font-size: 20px;
            text-align: center;
            color: var(--dark-color);
            border-bottom: 2px solid var(--light-color);
            padding-bottom: 15px;
        }

        .modal-input, textarea {
            width: 100%;
            padding: 15px;
            border-radius: var(--border-radius);
            border: 2px solid #ddd;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .modal-input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea {
            text-align: left;
            resize: vertical;
            min-height: 100px;
            font-weight: normal;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .modal-buttons button:active { transform: scale(0.98); }

        .btn-confirm { background-color: var(--success-color); }
        .btn-cancel { background-color: var(--danger-color); }

        .custom-file-upload {
            display: block;
            padding: 15px;
            background-color: var(--light-color);
            border: 2px dashed var(--gray-color);
            border-radius: var(--border-radius);
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: var(--dark-color);
            transition: all 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #e9ecef;
            border-color: var(--primary-color);
        }

        input[type="file"] { display: none; }

        #photoPreview {
            margin-top: 10px;
            text-align: center;
        }

        #photoPreview img {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .conflict-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .conflict-btn-group button {
            padding: 15px;
            font-size: 15px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .blue-dot {
            width: 20px;
            height: 20px;
            background-color: var(--primary-color);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .team-dot {
            width: 36px;
            height: 36px;
            background-color: var(--primary-color);
            color: white;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        .flag-icon {
            font-size: 28px;
            text-align: center;
            line-height: 28px;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.5));
        }

        .archive-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .archive-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s ease;
        }

        .archive-item:hover { background: var(--light-color); }

        .delete-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 8px 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .delete-btn:hover { background: #c82333; }

        .popup-del-btn {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: var(--border-radius);
            font-size: 13px;
            cursor: pointer;
            margin-top: 5px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .popup-del-btn:hover { background: #218838; }

        .recent-cerchia-btn {
            background: var(--light-color);
            border: 2px solid #ced4da;
            border-radius: var(--border-radius);
            padding: 15px;
            font-weight: 600;
            color: var(--dark-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .recent-cerchia-btn:active {
            background: #dee2e6;
            transform: scale(0.98);
        }

        .leaflet-routing-container { display: none !important; }

        @media (max-width: 480px) {
            .control-panel {
                width: calc(100% - 30px);
                right: 15px;
            }
            
            .app-title {
                font-size: 16px;
            }
            
            .modal-content {
                padding: 20px;
                width: 95%;
            }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title">🚗 Driver Geo Max</div>
        <div class="status-indicator">
            <span id="statusText">Offline</span>
            <div class="status-dot" id="statusDot"></div>
        </div>
    </header>

    <div id="map"></div>
    <div id="cerchiaBadge">👤 Non connesso</div>
    
    <div id="searchContainer">
        <input type="text" id="searchInput" placeholder="🔍 Cerca destinazione..." autocomplete="off">
        <ul id="searchResults"></ul>
        <button id="cancelNavBtn">❌ Termina Navigazione</button>
    </div>

    <button id="menuToggleBtn">⚙️</button>

    <div class="control-panel" id="mainPanel">
        <button class="control-btn btn-record" id="recordRouteBtn">🔴 Registra Percorso</button>
        <button class="control-btn btn-note" id="addNoteBtn">📝 Aggiungi Tappa/Nota</button>
        <button class="control-btn btn-block" id="blockRoadBtn">🚧 Segnala Interruzione</button>
        <div id="cancelBlockBtn">❌ Annulla Segnalazione</div>
        <button class="control-btn btn-sync" id="joinCerchiaMenuBtn">📡 Gestione Cerchie</button>
        <button class="control-btn btn-archive" id="openArchiveBtn">🗂️ Archivio Condiviso</button>
    </div>

    <!-- Modal Inizializzazione -->
    <div class="modal-overlay active" id="initModal">
        <div class="modal-content">
            <h3>⚙️ Configurazione Team</h3>
            
            <div style="text-align: center; font-size: 14px; padding: 12px; background: var(--light-color); border-radius: var(--border-radius); margin-bottom: 15px;">
                Stato: <span id="currentCerchiaStatusText" style="font-weight:bold; color: var(--gray-color);">Offline</span>
            </div>

            <div class="conflict-btn-group" id="leaveCerchiaDiv" style="display: none;">
                <button class="btn-cancel" id="btnLeaveCerchia">Scollegati ed esci dalla Cerchia</button>
            </div>

            <hr style="width: 100%; border: 0; border-top: 1px solid #eee; margin: 10px 0;">

            <p style="font-size: 14px; text-align: center; margin: 0 0 15px 0; color: #555;">
                Entra in una nuova cerchia di lavoro:
            </p>

            <input type="text" id="initNameInput" class="modal-input" maxlength="3" placeholder="Iniziali (es. MR)" autocapitalize="characters">
            <input type="text" id="initCerchiaInput" class="modal-input" placeholder="Codice Cerchia..." autocapitalize="characters" autocorrect="off" spellcheck="false" style="margin-top: 10px;">
            <button class="control-btn btn-sync" id="btnJoinInit" style="width: 100%; margin-top: 10px;">📡 Connetti al Team</button>
            
            <div id="recentCerchieContainer" style="display: none; margin-top: 10px;">
                <p style="font-size: 13px; text-align: center; margin: 0 0 5px 0; color: #555;">Cerchie recenti:</p>
                <div class="conflict-btn-group" id="recentCerchieList"></div>
            </div>
            
            <button class="btn-cancel" id="btnCloseInitModal" style="margin-top: 10px; background: var(--gray-color);">Chiudi (Continua Offline)</button>
        </div>
    </div>

    <!-- Modal Tappe -->
    <div class="modal-overlay" id="noteModal">
        <div class="modal-content">
            <h3>Nuova Tappa</h3>
            <textarea id="noteText" placeholder="Descrizione del luogo..."></textarea>
            <label for="notePhoto" class="custom-file-upload">📷 Scatta o carica foto</label>
            <input type="file" id="notePhoto" accept="image/*" capture="environment">
            <div id="photoPreview"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelNoteBtn" style="background:var(--gray-color);">Annulla</button>
                <button class="btn-confirm" id="saveNoteBtn">Salva</button>
            </div>
        </div>
    </div>

    <!-- Modal Archivio -->
    <div class="modal-overlay" id="archiveModal">
        <div class="modal-content">
            <h3>Archivio Percorsi</h3>
            <ul class="archive-list" id="archiveList"></ul>
            <div class="modal-buttons">
                <button class="btn-cancel" id="closeArchiveBtn" style="background:var(--gray-color);">Chiudi</button>
            </div>
        </div>
    </div>

    <div id="toastMsg"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBnB_5Z8jbP22KLpiBkI9z6QLAy0O4yPBQ",
            authDomain: "driver-geo-max.firebaseapp.com",
            databaseURL: "https://driver-geo-max-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "driver-geo-max",
            storageBucket: "driver-geo-max.firebasestorage.app",
            messagingSenderId: "837223951164",
            appId: "1:837223951164:web:0516f9e6832f77d1ae8c39"
        };

        let db = null;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } 
        catch (e) { console.warn("Firebase offline"); }

        let saveTimeout;
        function debouncedSave(key, data) {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (error) {
                    console.error("Errore salvataggio localStorage:", error);
                }
            }, 500);
        }

        async function retryFirebaseOperation(operation, maxRetries = 3) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    return await operation();
                } catch (error) {
                    if (attempt === maxRetries) throw error;
                    const delay = Math.min(1000 * Math.pow(2, attempt - 1), 5000);
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        function sanitizeInput(input) { 
            if (!input) return '';
            return String(input).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            }).substring(0, 500); 
        }

        function sanitizeHtml(html) { 
            if (typeof html !== 'string') return ''; 
            return html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '').replace(/javascript:/gi, '').replace(/on\w+=/gi, ''); 
        }

        let myUserId = localStorage.getItem('geoUserId');
        if (!myUserId) { myUserId = 'user_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('geoUserId', myUserId); }
        let myInitials = localStorage.getItem('geoInitials') || '';
        document.getElementById('initNameInput').value = myInitials;

        function distanceToSegmentMeters(p, a, b) {
            const cosLat = Math.cos((p[0] * Math.PI) / 180);
            const P = { x: 0, y: 0 }, A = { x: (a[1] - p[1]) * cosLat * 111320, y: (a[0] - p[0]) * 110540 }, B = { x: (b[1] - p[1]) * cosLat * 111320, y: (b[0] - p[0]) * 110540 };
            const dx = B.x - A.x, dy = B.y - A.y;
            const len2 = dx * dx + dy * dy;
            if (len2 === 0) return Math.hypot(P.x - A.x, P.y - A.y);
            let t = Math.max(0, Math.min(1, ((P.x - A.x) * dx + (P.y - A.y) * dy) / len2));
            return Math.hypot(P.x - (A.x + t * dx), P.y - (A.y + t * dy));
        }

        const map = L.map('map', { zoomControl: false }).setView([41.06, 16.92], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const dataLayerGroup = L.layerGroup().addTo(map);
        const tempLayerGroup = L.layerGroup().addTo(map);
        const teamLayerGroup = L.layerGroup().addTo(map); 
        
        const userIcon = L.divIcon({ html: '<div class="blue-dot"></div>', className: '', iconSize: [24,24], iconAnchor: [12,12] });
        const destIcon = L.divIcon({ html: '🏁', className: 'flag-icon', iconSize: [30,30], iconAnchor: [15,30] });
        const noteIcon = L.divIcon({ html: '📌', className: 'flag-icon', iconSize: [30,30], iconAnchor: [15,30] });
        const blockIcon = L.divIcon({ html: '🚧', className: 'flag-icon', iconSize: [30,30], iconAnchor: [15,30] });

        let userMarker = null; let routingControl = null;
        let activeCerchia = localStorage.getItem('geoCerchia') || null;
        let recentCerchie = JSON.parse(localStorage.getItem('geoRecentCerchie') || '[]');
        let localRoutes = JSON.parse(localStorage.getItem('geoRoutes') || '[]');
        let localBlocks = JSON.parse(localStorage.getItem('geoBlocks') || '[]');
        let activeCerchiaRef = null; let teamMarkers = {};
        
        let isRecording = false; let currentRoutePoints = []; let currentRouteNotes = []; let currentRouteLine = null;
        let blockMode = 0; let tempBlockStart = null; let tempBlockMarker = null;
        let isAddingNoteMode = false; let tempNoteLatLng = null; let tempNoteImage = null;

        document.getElementById('menuToggleBtn').addEventListener('click', () => document.getElementById('mainPanel').classList.toggle('active'));

        function showToast(msg, alert=false) {
            const t = document.getElementById('toastMsg');
            t.innerText = msg; t.className = alert ? 'alert show' : 'show';
            setTimeout(() => t.classList.remove('show'), alert ? 5000 : 3000);
        }

        function updateHeaderStatus(online, text) {
            document.getElementById('statusText').innerText = text;
            const dot = document.getElementById('statusDot');
            dot.className = online ? 'status-dot online' : 'status-dot offline';
        }

        let globalWatchId = null;
        let lastCheckTime = 0;
        let lastRadarSyncTime = 0;

        function avviaLocalizzazioneGlobale() {
            if (!navigator.geolocation) return showToast("GPS non supportato", true);
            if (globalWatchId) return;

            globalWatchId = navigator.geolocation.watchPosition((pos) => {
                const latlng = [pos.coords.latitude, pos.coords.longitude];
                const now = Date.now();

                if (!userMarker) { 
                    userMarker = L.marker(latlng, { icon: userIcon }).addTo(map); 
                    map.setView(latlng, 16); 
                } else { 
                    userMarker.setLatLng(latlng); 
                }

                if (activeCerchia && db && myInitials && (now - lastRadarSyncTime > 5000)) {
                    lastRadarSyncTime = now;
                    db.ref(`cerchie/${activeCerchia}/users/${myUserId}`).set({
                        lat: latlng[0], lng: latlng[1], initials: myInitials
                    });
                }

                if (isRecording) {
                    let distance = 0;
                    if (currentRoutePoints.length > 0) {
                        const lastPt = currentRoutePoints[currentRoutePoints.length - 1];
                        distance = map.distance(latlng, lastPt);
                    }

                    if (currentRoutePoints.length === 0 || (distance >= 30 && distance < 2000)) {
                        currentRoutePoints.push(latlng); 
                        if(currentRouteLine) currentRouteLine.setLatLngs(currentRoutePoints);
                        map.panTo(latlng); 
                    }

                    if (now - lastCheckTime > 1000) {
                        lastCheckTime = now;
                        localBlocks.forEach(block => {
                            const distToBlock = distanceToSegmentMeters(latlng, block.start, block.end);
                            if (distToBlock < 15 && !block.notified) { 
                                showToast("⚠️ ATTENZIONE: STRADA INTERROTTA!", true); 
                                if (navigator.vibrate) navigator.vibrate([300, 150, 300]); 
                                block.notified = true; 
                            } else if (distToBlock > 50) { 
                                block.notified = false; 
                            }
                        });
                    }
                }
            }, () => showToast("Attiva il GPS per la localizzazione", true), { 
                enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 
            });
        }
        
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            if (query.length < 3) { searchResults.style.display = 'none'; return; }
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&countrycodes=it`)
                .then(res => res.json()).then(data => {
                    searchResults.innerHTML = '';
                    if(data.length > 0) {
                        searchResults.style.display = 'block';
                        data.forEach(item => {
                            const li = document.createElement('li'); li.innerText = item.display_name.split(',').slice(0,3).join(',');
                            li.onclick = () => avviaNavigazione(item.lat, item.lon, li.innerText); searchResults.appendChild(li);
                        });
                    } else searchResults.style.display = 'none';
                });
            }, 400);
        });
        document.addEventListener('click', (e) => { if (!document.getElementById('searchContainer').contains(e.target)) searchResults.style.display = 'none'; });

        // --- NAVIGAZIONE MULTI-TAPPA IN SEQUENZA ---
        function avviaNavigazione(destLat, destLng, destName, tappeIntermedie = []) {
            searchResults.style.display = 'none'; searchInput.value = destName; searchInput.blur(); document.getElementById('cancelNavBtn').style.display = 'block';
            if (!userMarker) return showToast("Attendo posizione GPS...", true);
            showToast("Calcolo percorso in sequenza...");
            
            if (routingControl) { map.removeControl(routingControl); routingControl = null; }

            let waypoints = [userMarker.getLatLng()];
            if (tappeIntermedie && tappeIntermedie.length > 0) {
                tappeIntermedie.forEach(tappa => {
                    waypoints.push(L.latLng(tappa.lat, tappa.lng));
                });
            }
            waypoints.push(L.latLng(destLat, destLng));

            routingControl = L.Routing.control({
                waypoints: waypoints,
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
                lineOptions: { styles: [{ color: '#007bff', opacity: 0.8, weight: 6 }] }, showAlternatives: false, routeWhileDragging: false,
                createMarker: function(i, wp, nWps) { 
                    if (i === 0) return null; 
                    if (i === nWps - 1) return L.marker(wp.latLng, { icon: destIcon }); 
                    return L.marker(wp.latLng, { icon: noteIcon }); 
                }
            }).addTo(map);
        }

        document.getElementById('cancelNavBtn').addEventListener('click', () => {
            if (routingControl) { map.removeControl(routingControl); routingControl = null; }
            document.getElementById('cancelNavBtn').style.display = 'none'; searchInput.value = ''; showToast("Navigazione terminata.");
        });

        function renderCerchieUI() {
            const statusText = document.getElementById('currentCerchiaStatusText');
            const leaveBtnDiv = document.getElementById('leaveCerchiaDiv');
            const recentContainer = document.getElementById('recentCerchieContainer');
            const recentList = document.getElementById('recentCerchieList');
            const badge = document.getElementById('cerchiaBadge');

            if (activeCerchia) {
                statusText.innerText = activeCerchia; statusText.style.color = "var(--success-color)";
                leaveBtnDiv.style.display = "flex";
                badge.innerHTML = `📡 ${activeCerchia}`; badge.style.background = "rgba(40, 167, 69, 0.95)";
                updateHeaderStatus(true, activeCerchia);
            } else {
                statusText.innerText = "Offline"; statusText.style.color = "var(--gray-color)";
                leaveBtnDiv.style.display = "none";
                badge.innerHTML = "👤 Non connesso"; badge.style.background = "rgba(108, 117, 125, 0.95)";
                updateHeaderStatus(false, "Offline");
            }

            recentList.innerHTML = '';
            const filteredRecent = recentCerchie.filter(c => c !== activeCerchia);
            if (filteredRecent.length > 0) {
                recentContainer.style.display = "block";
                filteredRecent.forEach(codice => {
                    const btn = document.createElement('button'); btn.className = "recent-cerchia-btn";
                    btn.innerHTML = `<span>👥 ${codice}</span> <span>Entra ➔</span>`;
                    btn.onclick = () => { document.getElementById('initModal').classList.remove('active'); avviaSincronizzazione(codice); avviaLocalizzazioneGlobale(); };
                    recentList.appendChild(btn);
                });
            } else { recentContainer.style.display = "none"; }
        }

        function saveRecentCerchia(codice) {
            recentCerchie = recentCerchie.filter(c => c !== codice); recentCerchie.unshift(codice);
            if(recentCerchie.length > 5) recentCerchie.pop(); localStorage.setItem('geoRecentCerchie', JSON.stringify(recentCerchie));
        }

        if (activeCerchia) { document.getElementById('initModal').classList.remove('active'); avviaSincronizzazione(activeCerchia); renderCerchieUI(); } 
        else { renderCerchieUI(); renderDatiLocali(); }

        document.getElementById('btnCloseInitModal').addEventListener('click', () => { document.getElementById('initModal').classList.remove('active'); if(!activeCerchia) impostaUIOffline(); avviaLocalizzazioneGlobale(); });
        document.getElementById('btnLeaveCerchia').addEventListener('click', () => { impostaUIOffline(); showToast("Sei uscito dalla cerchia. Modalità Offline."); });

        document.getElementById('btnJoinInit').addEventListener('click', () => {
            const ini = sanitizeInput(document.getElementById('initNameInput').value.trim().toUpperCase());
            if (ini.length < 1) return showToast("Inserisci le tue iniziali!");
            myInitials = ini.substring(0, 3); localStorage.setItem('geoInitials', myInitials);
            
            const codice = sanitizeInput(document.getElementById('initCerchiaInput').value.trim().toUpperCase());
            if (codice.length < 3) return showToast("Codice Cerchia troppo corto!");
            
            document.getElementById('initModal').classList.remove('active'); document.getElementById('initCerchiaInput').value = '';
            avviaSincronizzazione(codice); avviaLocalizzazioneGlobale();
        });

        document.getElementById('joinCerchiaMenuBtn').addEventListener('click', () => { document.getElementById('mainPanel').classList.remove('active'); renderCerchieUI(); document.getElementById('initModal').classList.add('active'); });

        function impostaUIOffline() {
            if (activeCerchiaRef) { 
                if(db && myUserId) db.ref(`cerchie/${activeCerchia}/users/${myUserId}`).remove();
                activeCerchiaRef.off(); activeCerchiaRef = null; 
            }
            activeCerchia = null; localStorage.removeItem('geoCerchia'); teamLayerGroup.clearLayers(); teamMarkers = {}; renderCerchieUI(); renderDatiLocali();
        }

        function renderDatiLocali() {
            dataLayerGroup.clearLayers(); tempLayerGroup.clearLayers();
            localRoutes.forEach((r, i) => renderRoute(r, i)); 
            localBlocks.forEach(b => { b.notified = false; renderBlock(b); });
        }

        function renderRoute(route, index) {
            const pl = L.polyline(route.points, { color: 'purple', weight: 4, opacity: 0.8 }).addTo(dataLayerGroup);
            
            let popupHtml = `<b>${sanitizeInput(route.name)}</b>`;
            if (route.points && route.points.length > 0) {
                const dest = route.points[route.points.length - 1];
                popupHtml += `<br><button class="popup-del-btn" onclick="navigaPercorsoSalvato(${index})">🧭 Naviga Percorso</button>`;
            }
            pl.bindPopup(sanitizeHtml(popupHtml));

            if (route.notes) route.notes.forEach(n => {
                let c = `<b>${sanitizeInput(n.text || 'Tappa')}</b>`; if (n.image) c += `<br><img src="${n.image}">`;
                L.marker([n.lat, n.lng], { icon: noteIcon }).addTo(dataLayerGroup).bindPopup(sanitizeHtml(c));
            });
        }

        window.navigaPercorsoSalvato = function(index) {
            const route = localRoutes[index];
            if (!route || !route.points || route.points.length === 0) return;
            const dest = route.points[route.points.length - 1];
            avviaNavigazione(dest[0], dest[1], route.name, route.notes || []);
        };

        function renderBlock(block) {
            const line = L.polyline([block.start, block.end], { color: 'red', weight: 5, dashArray: '10, 10' }).addTo(dataLayerGroup);
            const m1 = L.marker(block.start, { icon: blockIcon }).addTo(dataLayerGroup); const m2 = L.marker(block.end, { icon: blockIcon }).addTo(dataLayerGroup);
            const html = `<b>🚧 Interruzione</b><br><button class="popup-del-btn" onclick="deleteBlock('${block.id||''}', ${block.start[0]}, ${block.start[1]})">🟢 Riapri</button>`;
            line.bindPopup(html); m1.bindPopup(html); m2.bindPopup(html);
        }

        function avviaSincronizzazione(codice) {
            if (!db) { impostaUIOffline(); avviaLocalizzazioneGlobale(); return showToast("Offline mode.", true); }
            if (activeCerchiaRef) { activeCerchiaRef.off(); activeCerchiaRef = null; teamLayerGroup.clearLayers(); teamMarkers = {}; }
            
            activeCerchia = codice; localStorage.setItem('geoCerchia', codice); saveRecentCerchia(codice); renderCerchieUI(); showToast("Sincronizzazione..."); avviaLocalizzazioneGlobale();
            
            db.ref(`cerchie/${activeCerchia}/users/${myUserId}`).onDisconnect().remove();

            retryFirebaseOperation(() => db.ref('cerchie/' + activeCerchia).once('value')).then(snapshot => {
                const cloudData = snapshot.val() || { blocks: {}, routes: {} }; localBlocks = []; localRoutes = [];
                Object.entries(cloudData.blocks || {}).forEach(([id, val]) => { val.id = id; localBlocks.push(val); });
                Object.entries(cloudData.routes || {}).forEach(([id, val]) => { val.id = id; localRoutes.push(val); });
                debouncedSave('geoBlocks', localBlocks); debouncedSave('geoRoutes', localRoutes);
                attivaAscoltoLive(); showToast(`Connesso a: ${codice}`);
            }).catch(() => { impostaUIOffline(); showToast("Errore rete. Offline.", true); });
        }

        function attivaAscoltoLive() {
            renderDatiLocali(); activeCerchiaRef = db.ref('cerchie/' + activeCerchia);
            
            activeCerchiaRef.child('routes').on('child_added', s => { const r = s.val(); r.id = s.key; if (!localRoutes.some(x => x.id === r.id)) { localRoutes.push(r); debouncedSave('geoRoutes', localRoutes); renderRoute(r, localRoutes.length - 1); } });
            activeCerchiaRef.child('routes').on('child_removed', s => { localRoutes = localRoutes.filter(r => r.id !== s.key); debouncedSave('geoRoutes', localRoutes); renderDatiLocali(); });
            activeCerchiaRef.child('blocks').on('child_added', s => { const b = s.val(); b.id = s.key; if (!localBlocks.some(x => x.id === b.id)) { b.notified = false; localBlocks.push(b); debouncedSave('geoBlocks', localBlocks); renderBlock(b); } });
            activeCerchiaRef.child('blocks').on('child_removed', s => { localBlocks = localBlocks.filter(b => b.id !== s.key); debouncedSave('geoBlocks', localBlocks); renderDatiLocali(); });
            
            activeCerchiaRef.child('users').on('value', snapshot => {
                const users = snapshot.val() || {}; 
                for (let id in teamMarkers) {
                    if (!users[id]) { teamLayerGroup.removeLayer(teamMarkers[id]); delete teamMarkers[id]; }
                }
                for (let id in users) {
                    if (id === myUserId) continue;
                    const u = users[id];
                    if (teamMarkers[id]) { teamMarkers[id].setLatLng([u.lat, u.lng]); } 
                    else {
                        const icon = L.divIcon({ html: `<div class="team-dot">${sanitizeInput(u.initials)}</div>`, className: '', iconSize: [36,36], iconAnchor: [18,18] });
                        teamMarkers[id] = L.marker([u.lat, u.lng], { icon: icon }).addTo(teamLayerGroup).bindPopup(`<b>Autista: ${sanitizeInput(u.initials)}</b>`);
                    }
                }
            });
        }

        map.on('click', (e) => {
            document.getElementById('mainPanel').classList.remove('active');
            if (isAddingNoteMode) {
                tempNoteLatLng = e.latlng; document.getElementById('noteText').value = ''; document.getElementById('notePhoto').value = '';
                document.getElementById('photoPreview').innerHTML = ''; tempNoteImage = null; document.getElementById('noteModal').classList.add('active'); isAddingNoteMode = false;
            } 
            else if (blockMode === 1) { 
                tempBlockStart = e.latlng; tempBlockMarker = L.marker(tempBlockStart, { icon: blockIcon }).addTo(map); blockMode = 2; showToast("Tocca la FINE dell'interruzione 🚧"); 
            } 
            else if (blockMode === 2) {
                const newBlock = { start: [tempBlockStart.lat, tempBlockStart.lng], end: [e.latlng.lat, e.latlng.lng] };
                if (activeCerchia && db) retryFirebaseOperation(() => db.ref('cerchie/' + activeCerchia + '/blocks').push(newBlock));
                else { localBlocks.push(newBlock); debouncedSave('geoBlocks', localBlocks); renderBlock(newBlock); }
                blockMode = 0; tempBlockStart = null; document.getElementById('cancelBlockBtn').style.display = 'none'; if (tempBlockMarker) map.removeLayer(tempBlockMarker);
            }
        });

        document.getElementById('addNoteBtn').addEventListener('click', () => { isAddingNoteMode = true; document.getElementById('mainPanel').classList.remove('active'); showToast("Tocca la mappa per la tappa 📍"); });
        document.getElementById('cancelNoteBtn').addEventListener('click', () => { document.getElementById('noteModal').classList.remove('active'); });
        
        document.getElementById('notePhoto').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file || !file.type.match('image.*')) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); const w = 400, h = Math.round((img.height * 400) / img.width);
                    canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    tempNoteImage = canvas.toDataURL('image/jpeg', 0.6); document.getElementById('photoPreview').innerHTML = `<img src="${tempNoteImage}">`;
                }; img.src = evt.target.result;
            }; reader.readAsDataURL(file);
        });

        document.getElementById('saveNoteBtn').addEventListener('click', () => {
            const text = sanitizeInput(document.getElementById('noteText').value);
            if ((text !== '' || tempNoteImage) && tempNoteLatLng) {
                currentRouteNotes.push({ lat: tempNoteLatLng.lat, lng: tempNoteLatLng.lng, text, image: tempNoteImage });
                L.marker(tempNoteLatLng, { icon: noteIcon }).addTo(tempLayerGroup); showToast("Tappa salvata!");
            }
            document.getElementById('noteModal').classList.remove('active');
        });

        document.getElementById('blockRoadBtn').addEventListener('click', () => { blockMode = 1; document.getElementById('cancelBlockBtn').style.display = 'block'; document.getElementById('mainPanel').classList.remove('active'); showToast("Tocca l'INIZIO interruzione 🚧"); });
        document.getElementById('cancelBlockBtn').addEventListener('click', () => { blockMode = 0; tempBlockStart = null; if (tempBlockMarker) map.removeLayer(tempBlockMarker); document.getElementById('cancelBlockBtn').style.display = 'none'; showToast("Annullato."); });
        
        window.deleteBlock = function(id, lat, lng) {
            if (confirm("Riaprire questa strada?")) {
                if (activeCerchia && db && id) retryFirebaseOperation(() => db.ref('cerchie/' + activeCerchia + '/blocks/' + id).remove());
                else { localBlocks = localBlocks.filter(b => b.start[0] !== lat); debouncedSave('geoBlocks', localBlocks); renderDatiLocali(); }
            }
        };

        const recordBtn = document.getElementById('recordRouteBtn');
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                isRecording = true; recordBtn.innerText = "⏹️ Ferma e Salva"; recordBtn.classList.replace('btn-record', 'btn-stop'); document.getElementById('mainPanel').classList.remove('active');
                currentRoutePoints = []; currentRouteNotes = []; currentRouteLine = L.polyline([], { color: '#007bff', weight: 4 }).addTo(map);
                if (userMarker) { currentRoutePoints.push([userMarker.getLatLng().lat, userMarker.getLatLng().lng]); currentRouteLine.setLatLngs(currentRoutePoints); map.setView(userMarker.getLatLng()); }
            } else {
                isRecording = false; recordBtn.innerText = "🔴 Registra Percorso"; recordBtn.classList.replace('btn-stop', 'btn-record');
                if (currentRouteLine) map.removeLayer(currentRouteLine); tempLayerGroup.clearLayers();
                if (currentRoutePoints.length > 1) {
                    const name = sanitizeInput(prompt("Nome del percorso:", "Nuovo Viaggio"));
                    if (name) {
                        const r = { name, points: currentRoutePoints, notes: currentRouteNotes };
                        if (activeCerchia && db) retryFirebaseOperation(() => db.ref('cerchie/' + activeCerchia + '/routes').push(r));
                        else { localRoutes.push(r); debouncedSave('geoRoutes', localRoutes); renderRoute(r, localRoutes.length - 1); }
                    }
                }
            }
        });

        document.getElementById('openArchiveBtn').addEventListener('click', () => { document.getElementById('mainPanel').classList.remove('active'); renderArchiveUI(); document.getElementById('archiveModal').classList.add('active'); });
        document.getElementById('closeArchiveBtn').addEventListener('click', () => { document.getElementById('archiveModal').classList.add('active'); document.getElementById('archiveModal').classList.remove('active'); });
        
        function renderArchiveUI() {
            const list = document.getElementById('archiveList'); list.innerHTML = '';
            if (localRoutes.length === 0) return list.innerHTML = '<p style="text-align:center;">Nessun percorso.</p>';
            localRoutes.forEach((r, i) => { const li = document.createElement('li'); li.className = 'archive-item'; li.innerHTML = `<span><b>${sanitizeInput(r.name)}</b></span> <button class="delete-btn" onclick="deleteRoute(${i})">Elimina</button>`; list.appendChild(li); });
        }
        window.deleteRoute = function(i) {
            if (confirm("Rimuovere il percorso?")) {
                const r = localRoutes[i];
                if (activeCerchia && db && r.id) retryFirebaseOperation(() => db.ref('cerchie/' + activeCerchia + '/routes/' + r.id).remove());
                else { localRoutes.splice(i, 1); debouncedSave('geoRoutes', localRoutes); renderDatiLocali(); renderArchiveUI(); }
            }
        };
    </script>
</body>
</html>
