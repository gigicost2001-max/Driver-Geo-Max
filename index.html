<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Driver Geo Max - Enterprise Ultimate</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        :root {
            --primary-color: #007bff;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --dark-color: #343a40;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --border-radius: 8px;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
            --transition: all 0.2s ease-out;
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
        * { box-sizing: border-box; }
        body, html { height: 100vh; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .app-header { position: absolute; top: 0; left: 0; right: 0; height: 60px; background: linear-gradient(135deg, var(--primary-color), #0056b3); color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; box-shadow: var(--shadow); }
        .app-title { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--gray-color); transition: var(--transition); }
        .status-dot.online { background-color: var(--success-color); }
        .status-dot.offline { background-color: var(--danger-color); }
        #map { width: 100%; height: 100%; z-index: 1; background: #f8f9fa; }
        #cerchiaBadge { position: absolute; bottom: 30px; left: 15px; z-index: 1000; background: rgba(108, 117, 125, 0.95); color: white; border-radius: 20px; padding: 12px 16px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px; max-width: 200px; }
        #searchContainer { position: absolute; top: 75px; left: 15px; right: 15px; z-index: 1000; }
        #searchInput { width: 100%; padding: 15px 20px; border-radius: 25px; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.95); box-shadow: var(--shadow); font-size: 16px; outline: none; backdrop-filter: blur(10px); transition: var(--transition); -webkit-appearance: none; }
        #searchInput:focus { border-color: var(--primary-color); background: white; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
        #searchResults { list-style: none; margin: 10px 0 0 0; padding: 0; background: white; border-radius: var(--border-radius); box-shadow: var(--shadow); max-height: 300px; overflow-y: auto; display: none; position: absolute; width: 100%; z-index: 1001; }
        #searchResults li { padding: 15px 20px; border-bottom: 1px solid #eee; font-size: 15px; cursor: pointer; min-height: 44px; display: flex; align-items: center; }
        #searchResults li:hover { background: var(--light-color); }
        #cancelNavBtn { display: none; margin-top: 10px; width: 100%; padding: 15px; border: none; border-radius: var(--border-radius); background: var(--danger-color); color: white; font-weight: 600; font-size: 16px; cursor: pointer; box-shadow: var(--shadow); min-height: 50px; }
        #menuToggleBtn { position: absolute; top: 75px; right: 15px; z-index: 1000; background: rgba(255,255,255,0.95); border: 2px solid rgba(0,0,0,0.1); border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .control-panel { position: absolute; top: 140px; right: 15px; z-index: 1000; background: white; padding: 20px; border-radius: var(--border-radius); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 15px; width: calc(100% - 60px); max-width: 320px; transform: translateY(-15px); opacity: 0; visibility: hidden; transition: var(--transition); }
        .control-panel.active { transform: translateY(0); opacity: 1; visibility: visible; }
        .control-btn { padding: 16px; border: none; border-radius: var(--border-radius); font-weight: 600; font-size: 16px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; }
        .btn-record { background-color: var(--primary-color); }
        .btn-stop { background-color: var(--danger-color); }
        .btn-note { background-color: var(--warning-color); color: var(--dark-color); }
        .btn-block { background-color: #fd7e14; }
        .btn-archive { background-color: var(--gray-color); }
        .btn-sync { background-color: var(--success-color); }
        #cancelBlockBtn { background: white; border: 2px solid var(--danger-color); border-radius: var(--border-radius); padding: 12px; font-size: 14px; color: var(--danger-color); font-weight: 600; cursor: pointer; display: none; text-align: center; width: 100%; min-height: 44px; }
        #toastMsg { position: absolute; bottom: -80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.9); color: white; padding: 15px 25px; border-radius: 30px; z-index: 2000; font-size: 15px; text-align: center; transition: bottom 0.4s ease; white-space: nowrap; font-weight: 600; max-width: 90%; backdrop-filter: blur(10px); }
        #toastMsg.show { bottom: 100px; }
        #toastMsg.alert { background: var(--danger-color); border: 2px solid white; }
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: opacity 0.2s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: white; padding: 25px; border-radius: var(--border-radius); width: 90%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .modal-input, textarea { width: 100%; padding: 15px; border-radius: var(--border-radius); border: 2px solid #ddd; font-size: 16px; font-weight: 600; text-align: center; min-height: 44px; }
        textarea { text-align: left; resize: vertical; min-height: 80px; }
        .modal-buttons { display: flex; justify-content: space-between; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 15px; border: none; border-radius: var(--border-radius); font-weight: 600; color: white; cursor: pointer; min-height: 48px; }
        .btn-confirm { background-color: var(--success-color); }
        .btn-cancel { background-color: var(--danger-color); }
        .blue-dot { width: 20px; height: 20px; background-color: var(--primary-color); border: 3px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .team-dot { width: 36px; height: 36px; background-color: var(--primary-color); color: white; border: 3px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; box-shadow: 0 3px 10px rgba(0,0,0,0.5); text-transform: uppercase; }
        .flag-icon { font-size: 28px; text-align: center; line-height: 28px; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.5)); }
        .archive-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
        .archive-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .delete-btn { border: none; border-radius: 5px; color: white; background: var(--danger-color); padding: 8px 15px; cursor: pointer; font-weight: bold; min-height: 44px; }
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-title">🚗 Driver Geo Max</div>
        <div class="status-indicator">
            <span id="statusText" role="status" aria-live="polite">Offline</span>
            <div class="status-dot" id="statusDot" role="status" aria-label="Connessione"></div>
        </div>
    </header>

    <div id="map"></div>
    <div id="cerchiaBadge">👤 Non connesso</div>
    
    <div id="searchContainer">
        <input type="text" id="searchInput" placeholder="🔍 Cerca destinazione..." autocomplete="off" aria-label="Cerca">
        <ul id="searchResults"></ul>
        <button id="cancelNavBtn" aria-label="Termina navigazione">❌ Termina Navigazione</button>
    </div>

    <button id="menuToggleBtn" aria-label="Menu">⚙️</button>

    <div class="control-panel" id="mainPanel">
        <button class="control-btn btn-record" id="recordRouteBtn" aria-pressed="false" aria-label="Registra">🔴 Registra Percorso</button>
        <button class="control-btn btn-note" id="addNoteBtn" aria-label="Nota">📝 Aggiungi Tappa</button>
        <button class="control-btn btn-block" id="blockRoadBtn" aria-label="Blocco">🚧 Segnala Interruzione</button>
        <div id="cancelBlockBtn" role="button" tabindex="0">❌ Annulla Segnalazione</div>
        <button class="control-btn btn-sync" id="joinCerchiaMenuBtn" aria-label="Cerchie">📡 Gestione Cerchie</button>
        <button class="control-btn btn-archive" id="openArchiveBtn" aria-label="Archivio">🗂️ Archivio</button>
    </div>

    <div class="modal-overlay active" id="initModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content" tabindex="-1">
            <h3 id="modalTitle">⚙️ Configurazione Team</h3>
            <div style="text-align: center; font-size: 14px; padding: 12px; background: var(--light-color); border-radius: 8px;">
                Stato: <span id="currentCerchiaStatusText" style="font-weight:bold; color: var(--gray-color);">Offline</span>
            </div>
            <input type="text" id="initNameInput" class="modal-input" maxlength="3" placeholder="Iniziali (es. MR)" autocapitalize="characters" aria-label="Iniziali">
            <input type="text" id="initCerchiaInput" class="modal-input" placeholder="Codice Cerchia..." autocapitalize="characters" style="margin-top: 8px;" aria-label="Codice cerchia">
            <button class="control-btn btn-sync" id="btnJoinInit" style="width: 100%; margin-top: 8px;">Connetti al Team</button>
            <button class="btn-cancel" id="btnCloseInitModal" style="margin-top: 8px; background: var(--gray-color); width:100%; border:none; border-radius:8px; color:white; font-weight:bold; min-height:48px; cursor:pointer;">Continua Offline</button>
        </div>
    </div>

    <div class="modal-overlay" id="noteModal" role="dialog" aria-modal="true">
        <div class="modal-content" tabindex="-1">
            <h3>Nuova Tappa / Nota</h3>
            <textarea id="noteText" placeholder="Descrizione del luogo..."></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelNoteBtn" style="background:var(--gray-color); border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer;">Annulla</button>
                <button class="btn-confirm" id="saveNoteBtn" style="border:none; border-radius:8px; cursor:pointer;">Salva</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="archiveModal" role="dialog" aria-modal="true">
        <div class="modal-content" tabindex="-1">
            <h3>Archivio Percorsi</h3>
            <ul class="archive-list" id="archiveList"></ul>
            <div class="modal-buttons">
                <button class="btn-cancel" id="closeArchiveBtn" style="background:var(--gray-color); border:none; border-radius:8px; color:white; font-weight:bold; width:100%; cursor:pointer;">Chiudi</button>
            </div>
        </div>
    </div>

    <div id="toastMsg"></div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBnB_5Z8jbP22KLpiBkI9z6QLAy0O4yPBQ",
            authDomain: "driver-geo-max.firebaseapp.com",
            databaseURL: "https://driver-geo-max-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "driver-geo-max",
            storageBucket: "driver-geo-max.firebasestorage.app",
            messagingSenderId: "837223951164",
            appId: "1:837223951164:web:0516f9e6832f77d1ae8c39"
        };

        let db = null, auth = null, authenticatedUserId = null;
        try {
            firebase.initializeApp(FIREBASE_CONFIG);
            db = firebase.database();
            auth = firebase.auth();
            auth.signInAnonymously().then(uc => {
                authenticatedUserId = uc.user.uid;
                AppState.setState({ userId: authenticatedUserId });
            }).catch(err => console.warn("Auth fallback locale:", err));
        } catch (e) { console.warn("Firebase offline"); }

        class ErrorHandler {
            logError(error, context = '') { console.error("Error:", context, error); }
            handleFirebaseError(error) {
                this.logError(error, 'Firebase');
                showToast('Errore di sincronizzazione dati', true);
            }
        }
        const errorHandler = new ErrorHandler();

        const AppState = {
            userId: localStorage.getItem('geoUserId') || ('user_' + Math.random().toString(36).substr(2, 9)),
            initials: localStorage.getItem('geoInitials') || '',
            activeCerchia: localStorage.getItem('geoCerchia') || null,
            isRecording: false,
            userPosition: null,
            init() { localStorage.setItem('geoUserId', this.userId); },
            setState(newState) {
                Object.assign(this, newState);
                if (newState.activeCerchia !== undefined) {
                    if (newState.activeCerchia) localStorage.setItem('geoCerchia', newState.activeCerchia);
                    else localStorage.removeItem('geoCerchia');
                }
                if (newState.initials !== undefined) localStorage.setItem('geoInitials', newState.initials);
            }
        };
        AppState.init();

        class OfflineQueueManager {
            constructor() {
                this.queue = JSON.parse(localStorage.getItem('offlineQueue') || '[]');
                window.addEventListener('online', () => {
                    document.getElementById('statusText').innerText = AppState.activeCerchia || "Online";
                    document.getElementById('statusDot').className = 'status-dot online';
                    this.syncQueue();
                });
                window.addEventListener('offline', () => {
                    document.getElementById('statusText').innerText = "Offline";
                    document.getElementById('statusDot').className = 'status-dot offline';
                    showToast("Connessione assente. Dati in coda.", true);
                });
            }
            add(op) {
                op.timestamp = Date.now();
                this.queue.push(op);
                localStorage.setItem('offlineQueue', JSON.stringify(this.queue));
                this.syncQueue();
            }
            async syncQueue() {
                if (!navigator.onLine || this.queue.length === 0 || !db) return;
                while (this.queue.length > 0) {
                    const op = this.queue[0];
                    try {
                        const ref = db.ref(op.path);
                        if (op.type === 'set') await ref.set(op.data);
                        else if (op.type === 'update') await ref.update(op.data);
                        else if (op.type === 'remove') await ref.remove();
                        this.queue.shift();
                        localStorage.setItem('offlineQueue', JSON.stringify(this.queue));
                    } catch (e) {
                        errorHandler.logError(e, 'OfflineQueue');
                        break;
                    }
                }
            }
        }
        const offlineQueue = new OfflineQueueManager();

        class PerformanceOptimizer {
            constructor() { this.timers = new Map(); }
            debounce(key, func, delay = 300) {
                if (this.timers.has(key)) clearTimeout(this.timers.get(key));
                return new Promise((resolve) => {
                    const timer = setTimeout(async () => {
                        const res = await func();
                        resolve(res);
                        this.timers.delete(key);
                    }, delay);
                    this.timers.set(key, timer);
                });
            }
        }
        const perfOptimizer = new PerformanceOptimizer();

        function sanitizeInput(input, maxLength = 500) {
            if (!input) return '';
            return String(input).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])).substring(0, maxLength);
        }

        document.getElementById('initNameInput').value = AppState.initials;

        const map = L.map('map', { zoomControl: false }).setView([41.06, 16.92], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const dataLayerGroup = L.layerGroup().addTo(map);
        const teamLayerGroup = L.layerGroup().addTo(map); 
        
        const userIcon = L.divIcon({ html: '<div class="blue-dot"></div>', className: '', iconSize: [24,24], iconAnchor: [12,12] });
        const destIcon = L.divIcon({ html: '🏁', className: 'flag-icon', iconSize: [30,30], iconAnchor: [15,30] });
        const noteIcon = L.divIcon({ html: '📌', className: 'flag-icon', iconSize: [30,30], iconAnchor: [15,30] });
        const blockIcon = L.divIcon({ html: '🚧', className: 'flag-icon', iconSize: [30,30], iconAnchor: [15,30] });

        let userMarker = null, routingControl = null, activeCerchiaRef = null, teamMarkers = {};
        let localRoutes = JSON.parse(localStorage.getItem('geoRoutes') || '[]');
        let localBlocks = JSON.parse(localStorage.getItem('geoBlocks') || '[]');
        let currentRoutePoints = [], currentRouteLine = null;
        let blockMode = 0, tempBlockStart = null, tempBlockMarker = null;

        document.getElementById('menuToggleBtn').addEventListener('click', () => document.getElementById('mainPanel').classList.toggle('active'));

        function showToast(msg, alert=false) {
            const t = document.getElementById('toastMsg');
            t.innerText = msg; t.className = alert ? 'alert show' : 'show';
            setTimeout(() => t.classList.remove('show'), alert ? 5000 : 3000);
        }

        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (show) { modal.classList.add('active'); modal.querySelector('.modal-content').focus(); }
            else { modal.classList.remove('active'); }
        }

        function avviaLocalizzazioneGlobale() {
            if (!navigator.geolocation) return showToast("GPS non supportato", true);
            navigator.geolocation.watchPosition(pos => {
                const latlng = [pos.coords.latitude, pos.coords.longitude];
                AppState.setState({ userPosition: latlng });
                if (!userMarker) { userMarker = L.marker(latlng, { icon: userIcon }).addTo(map); map.setView(latlng, 16); }
                else { userMarker.setLatLng(latlng); }

                if (AppState.isRecording) {
                    currentRoutePoints.push(latlng);
                    if (currentRouteLine) currentRouteLine.setLatLngs(currentRoutePoints);
                    else currentRouteLine = L.polyline(currentRoutePoints, { color: 'purple', weight: 4 }).addTo(dataLayerGroup);
                }

                if (AppState.activeCerchia && db && AppState.initials) {
                    const path = `cerchie/${AppState.activeCerchia}/users/${AppState.userId}`;
                    const payload = { lat: latlng[0], lng: latlng[1], initials: AppState.initials };
                    if (navigator.onLine) db.ref(path).set(payload).catch(err => errorHandler.logError(err, 'RadarSync'));
                    else offlineQueue.add({ type: 'set', path, data: payload });
                }
            }, err => showToast("GPS non disponibile", true), { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
        }

        document.getElementById('recordRouteBtn').addEventListener('click', () => {
            const btn = document.getElementById('recordRouteBtn');
            document.getElementById('mainPanel').classList.remove('active');
            if (!AppState.isRecording) {
                AppState.isRecording = true;
                currentRoutePoints = AppState.userPosition ? [AppState.userPosition] : [];
                btn.style.backgroundColor = 'var(--danger-color)';
                btn.innerHTML = '⏹️ Ferma Registrazione';
                showToast("Registrazione percorso avviata.");
            } else {
                AppState.isRecording = false;
                btn.style.backgroundColor = 'var(--primary-color)';
                btn.innerHTML = '🔴 Registra Percorso';
                if (currentRoutePoints.length > 1) {
                    const newRoute = { name: `Percorso ${new Date().toLocaleTimeString()}`, points: currentRoutePoints };
                    localRoutes.push(newRoute);
                    localStorage.setItem('geoRoutes', JSON.stringify(localRoutes));
                    if (AppState.activeCerchia && db) {
                        const rId = 'route_' + Date.now();
                        const path = `cerchie/${AppState.activeCerchia}/routes/${rId}`;
                        if (navigator.onLine) db.ref(path).set(newRoute);
                        else offlineQueue.add({ type: 'set', path, data: newRoute });
                    }
                    showToast("Percorso registrato e salvato!");
                }
                currentRoutePoints = [];
                currentRouteLine = null;
            }
        });

        document.getElementById('addNoteBtn').addEventListener('click', () => {
            document.getElementById('mainPanel').classList.remove('active');
            if (!AppState.userPosition) return showToast("Attendi il fix GPS per posizionare la tappa.", true);
            toggleModal('noteModal', true);
        });
        document.getElementById('cancelNoteBtn').addEventListener('click', () => toggleModal('noteModal', false));
        document.getElementById('saveNoteBtn').addEventListener('click', () => {
            const text = sanitizeInput(document.getElementById('noteText').value.trim());
            if (!text) return showToast("Inserisci una descrizione!", true);
            
            L.marker(AppState.userPosition, { icon: noteIcon }).addTo(dataLayerGroup).bindPopup(`<b>Nota:</b> ${text}`);
            toggleModal('noteModal', false);
            document.getElementById('noteText').value = '';
            showToast("Tappa salvata con successo.");
        });

        document.getElementById('blockRoadBtn').addEventListener('click', () => {
            document.getElementById('mainPanel').classList.remove('active');
            blockMode = 1;
            tempBlockStart = null;
            showToast("Tocca il punto di INIZIO dell'interruzione sulla mappa.");
            document.getElementById('cancelBlockBtn').style.display = 'block';
        });
        document.getElementById('cancelBlockBtn').addEventListener('click', () => {
            blockMode = 0;
            if (tempBlockMarker) { map.removeLayer(tempBlockMarker); tempBlockMarker = null; }
            document.getElementById('cancelBlockBtn').style.display = 'none';
            showToast("Segnalazione annullata.");
        });

        map.on('click', (e) => {
            if (blockMode === 1) {
                tempBlockStart = [e.latlng.lat, e.latlng.lng];
                tempBlockMarker = L.marker(tempBlockStart, { icon: blockIcon }).addTo(map);
                blockMode = 2;
                showToast("Ora tocca il punto di FINE dell'interruzione.");
            } else if (blockMode === 2) {
                const tempBlockEnd = [e.latlng.lat, e.latlng.lng];
                const blockData = { start: tempBlockStart, end: tempBlockEnd };
                localBlocks.push(blockData);
                localStorage.setItem('geoBlocks', JSON.stringify(localBlocks));
                
                L.polyline([tempBlockStart, tempBlockEnd], { color: 'red', weight: 5, dashArray: '10, 10' }).addTo(dataLayerGroup);
                if (tempBlockMarker) { map.removeLayer(tempBlockMarker); tempBlockMarker = null; }
                
                if (AppState.activeCerchia && db) {
                    const bId = 'block_' + Date.now();
                    const path = `cerchie/${AppState.activeCerchia}/blocks/${bId}`;
                    if (navigator.onLine) db.ref(path).set(blockData);
                    else offlineQueue.add({ type: 'set', path, data: blockData });
                }
                
                blockMode = 0;
                document.getElementById('cancelBlockBtn').style.display = 'none';
                showToast("Interruzione stradale segnalata!");
            }
        });

        document.getElementById('openArchiveBtn').addEventListener('click', () => {
            document.getElementById('mainPanel').classList.remove('active');
            const list = document.getElementById('archiveList');
            list.innerHTML = '';
            localRoutes.forEach((r, idx) => {
                const li = document.createElement('li');
                li.className = 'archive-item';
                li.innerHTML = `<span>${sanitizeInput(r.name)}</span> <button class="delete-btn" onclick="deleteRoute(${idx})">Elimina</button>`;
                list.appendChild(li);
            });
            toggleModal('archiveModal', true);
        });
        document.getElementById('closeArchiveBtn').addEventListener('click', () => toggleModal('archiveModal', false));

        window.deleteRoute = function(index) {
            localRoutes.splice(index, 1);
            localStorage.setItem('geoRoutes', JSON.stringify(localRoutes));
            dataLayerGroup.clearLayers();
            renderDatiLocali();
            document.getElementById('openArchiveBtn').click();
            showToast("Percorso eliminato.");
        };

        function renderDatiLocali() {
            localRoutes.forEach(r => {
                L.polyline(r.points, { color: 'purple', weight: 4 }).addTo(dataLayerGroup);
                if (r.points.length > 0) L.marker(r.points[r.points.length - 1], { icon: destIcon }).addTo(dataLayerGroup);
            });
            localBlocks.forEach(b => {
                L.polyline([b.start, b.end], { color: 'red', weight: 5, dashArray: '10, 10' }).addTo(dataLayerGroup);
            });
        }

        function avviaSincronizzazione(codice) {
            if (activeCerchiaRef) { activeCerchiaRef.off(); activeCerchiaRef = null; }
            if (!db) { avviaLocalizzazioneGlobale(); return showToast("Offline mode.", true); }
            
            AppState.setState({ activeCerchia: codice });
            document.getElementById('statusText').innerText = codice;
            document.getElementById('statusDot').className = 'status-dot online';
            avviaLocalizzazioneGlobale();

            activeCerchiaRef = db.ref('cerchie/' + codice);
            db.ref(`cerchie/${codice}/users/${AppState.userId}`).onDisconnect().remove();

            activeCerchiaRef.once('value').then(snapshot => {
                const cloudData = snapshot.val() || { blocks: {}, routes: {} };
                localBlocks = Object.values(cloudData.blocks || {});
                localRoutes = Object.values(cloudData.routes || {});
                localStorage.setItem('geoBlocks', JSON.stringify(localBlocks));
                localStorage.setItem('geoRoutes', JSON.stringify(localRoutes));
                renderDatiLocali();
            });

            activeCerchiaRef.child('users').on('value', snapshot => {
                const users = snapshot.val() || {};
                for (let id in teamMarkers) { if (!users[id]) { teamLayerGroup.removeLayer(teamMarkers[id]); delete teamMarkers[id]; } }
                for (let id in users) {
                    if (id === AppState.userId) continue;
                    const u = users[id];
                    if (teamMarkers[id]) teamMarkers[id].setLatLng([u.lat, u.lng]);
                    else {
                        const icon = L.divIcon({ html: `<div class="team-dot">${sanitizeInput(u.initials)}</div>`, className: '', iconSize: [36,36], iconAnchor: [18,18] });
                        teamMarkers[id] = L.marker([u.lat, u.lng], { icon: icon }).addTo(teamLayerGroup);
                    }
                }
            });
            showToast(`Connesso a: ${codice}`);
        }

        if (AppState.activeCerchia) { toggleModal('initModal', false); avviaSincronizzazione(AppState.activeCerchia); }
        else { renderDatiLocali(); }

        document.getElementById('btnCloseInitModal').addEventListener('click', () => { toggleModal('initModal', false); avviaLocalizzazioneGlobale(); });
        document.getElementById('btnJoinInit').addEventListener('click', () => {
            const ini = sanitizeInput(document.getElementById('initNameInput').value.trim().toUpperCase());
            const codice = sanitizeInput(document.getElementById('initCerchiaInput').value.trim().toUpperCase());
            if (ini.length < 2 || codice.length < 3) return showToast("Inserisci iniziali e codice validi!", true);
            AppState.setState({ initials: ini.substring(0, 3) });
            toggleModal('initModal', false);
            avviaSincronizzazione(codice);
        });
        document.getElementById('joinCerchiaMenuBtn').addEventListener('click', () => { document.getElementById('mainPanel').classList.remove('active'); toggleModal('initModal', true); });

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        searchInput.addEventListener('input', (e) => {
            const q = e.target.value;
            if (q.length < 3) { searchResults.style.display = 'none'; return; }
            perfOptimizer.debounce('search', () => {
                if (!navigator.onLine) { showToast("Ricerca offline non disponibile", true); return Promise.resolve(); }
                return fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&countrycodes=it`)
                .then(res => res.json()).then(data => {
                    searchResults.innerHTML = '';
                    if(data.length > 0) {
                        searchResults.style.display = 'block';
                        data.forEach(item => {
                            const li = document.createElement('li'); 
                            li.innerText = item.display_name.split(',').slice(0,3).join(',');
                            li.onclick = () => {
                                searchResults.style.display = 'none'; 
                                searchInput.value = li.innerText;
                                if(userMarker) {
                                    if(routingControl) map.removeControl(routingControl);
                                    routingControl = L.Routing.control({
                                        waypoints: [userMarker.getLatLng(), L.latLng(item.lat, item.lon)],
                                        router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' })
                                    }).addTo(map);
                                    document.getElementById('cancelNavBtn').style.display = 'block';
                                }
                            };
                            searchResults.appendChild(li);
                        });
                    }
                }).catch(err => { errorHandler.logError(err, 'Search'); showToast("Errore di ricerca", true); });
            }, 400);
        });

        document.getElementById('cancelNavBtn').addEventListener('click', () => {
            if(routingControl) { map.removeControl(routingControl); routingControl = null; }
            document.getElementById('cancelNavBtn').style.display = 'none'; 
            searchInput.value = '';
        });
    </script>
</body>
</html>
