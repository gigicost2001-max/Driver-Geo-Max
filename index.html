<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Driver Geo Max</title>
    
    <!-- COLLEGAMENTO ALL'ICONA E ALLA CONFIGURAZIONE APP NATIVA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://unpkg.com;
        img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com;
        connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com 
                    https://*.firebasedatabase.app wss://*.firebasedatabase.app 
                    https://www.gstatic.com https://*.googleapis.com 
                    https://nominatim.openstreetmap.org https://router.project-osrm.org;
    ">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; z-index: 1; }

        /* NAVIGATORE E RICERCA */
        #searchContainer { position: absolute; top: 15px; left: 15px; right: 90px; z-index: 1000; }
        #searchInput { width: 100%; padding: 12px 15px; border-radius: 25px; border: 2px solid rgba(0,0,0,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-size: 16px; outline: none; box-sizing: border-box; }
        #searchResults { list-style: none; margin: 5px 0 0 0; padding: 0; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-height: 250px; overflow-y: auto; display: none; position: absolute; width: 100%; }
        #searchResults li { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; }
        #searchResults li:last-child { border-bottom: none; }
        #searchResults li:hover { background: #f8f9fa; }
        #cancelNavBtn { display: none; margin-top: 10px; width: 100%; padding: 10px; border-radius: 20px; background: #dc3545; color: white; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .leaflet-routing-container { display: none !important; }

        #menuToggleBtn { position: absolute; top: 15px; right: 15px; z-index: 1000; background: white; border: 2px solid rgba(0,0,0,0.2); border-radius: 25px; padding: 12px 15px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; }
        #cerchiaBadge { position: absolute; bottom: 30px; left: 15px; z-index: 1000; background: #6c757d; color: white; border-radius: 8px; padding: 8px 12px; font-weight: bold; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .control-panel { position: absolute; top: 70px; right: 15px; z-index: 1000; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 12px; width: calc(100% - 60px); max-width: 300px; transform: translateY(-15px); opacity: 0; visibility: hidden; transition: all 0.3s ease; max-height: 80vh; overflow-y: auto; }
        .control-panel.active { transform: translateY(0); opacity: 1; visibility: visible; }
        
        .control-btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; color: white; cursor: pointer; }
        .btn-record { background-color: #007bff; } .btn-stop { background-color: #dc3545; }
        .btn-note { background-color: #ffc107; color: #212529; } .btn-block { background-color: #fd7e14; }
        .btn-archive { background-color: #6c757d; } .btn-sync { background-color: #28a745; }

        #cancelBlockBtn { background: #fff; border: 2px solid #dc3545; border-radius: 8px; padding: 8px; font-size: 13px; color: #dc3545; font-weight: bold; cursor: pointer; display: none; text-align: center; }

        #toastMsg { position: absolute; bottom: -60px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); color: white; padding: 12px 24px; border-radius: 30px; z-index: 2000; font-size: 14px; text-align: center; transition: bottom 0.4s ease; white-space: nowrap; font-weight: bold; }
        #toastMsg.show { bottom: 90px; } #toastMsg.alert { background: #dc3545; border: 2px solid white; }

        /* MODALI */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin: 0; font-size: 18px; text-align: center; }
        
        .modal-input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; font-weight: bold; text-align: center; box-sizing: border-box; }
        textarea { text-align: left; resize: none; height: 80px; font-weight: normal; }
        .modal-buttons { display: flex; justify-content: space-between; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-confirm { background: #28a745; } .btn-cancel { background: #dc3545; }
        
        .custom-file-upload { display: block; padding: 10px; background-color: #f8f9fa; border: 1px dashed #6c757d; border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; font-weight: bold; color: #495057; }
        input[type="file"] { display: none; }
        #photoPreview img { width: 100%; max-height: 140px; object-fit: cover; border-radius: 8px; }
        
        .conflict-btn-group { display: flex; flex-direction: column; gap: 8px; }
        .conflict-btn-group button { padding: 10px; font-size: 14px; }

        /* GRAFICA MAPPA */
        .blue-dot { width: 16px; height: 16px; background-color: #007bff; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.5); }
        .flag-icon { font-size: 26px; text-align: center; line-height: 26px; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5)); }
        
        .archive-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
        .archive-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .delete-btn { background: #dc3545; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-weight: bold; }
        .popup-del-btn { background: #28a745; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; margin-top: 5px; font-weight: bold; }

        /* GESTIONE CERCHIE RECENTI */
        .recent-cerchia-btn { background: #e9ecef; border: 1px solid #ced4da; border-radius: 8px; padding: 10px; font-weight: bold; color: #495057; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .recent-cerchia-btn:active { background: #dee2e6; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="cerchiaBadge">👤 Offline</div>
    
    <div id="searchContainer">
        <input type="text" id="searchInput" placeholder="Cerca via o città..." autocomplete="off">
        <ul id="searchResults"></ul>
        <button id="cancelNavBtn">❌ Termina Navigazione</button>
    </div>

    <button id="menuToggleBtn">⚙️</button>

    <div class="control-panel" id="mainPanel">
        <button class="control-btn btn-record" id="recordRouteBtn">🔴 Registra Percorso</button>
        <button class="control-btn btn-note" id="addNoteBtn">📝 Aggiungi Tappa/Nota</button>
        <button class="control-btn btn-block" id="blockRoadBtn">🚧 Segnala Interruzione</button>
        <div id="cancelBlockBtn">❌ Annulla Segnalazione</div>
        <button class="control-btn btn-sync" id="joinCerchiaMenuBtn">📡 Gestione Cerchie</button>
        <button class="control-btn btn-archive" id="openArchiveBtn">🗂️ Archivio Condiviso</button>
    </div>

    <!-- MODALE GESTIONE CERCHIE -->
    <div class="modal-overlay active" id="initModal">
        <div class="modal-content">
            <h3>Gestione Cerchie</h3>
            
            <div style="text-align: center; font-size: 14px; padding: 10px; background: #f8f9fa; border-radius: 8px;">
                Stato: <span id="currentCerchiaStatusText" style="font-weight:bold; color: #6c757d;">Offline</span>
            </div>

            <div class="conflict-btn-group" id="leaveCerchiaDiv" style="display: none;">
                <button class="btn-cancel" id="btnLeaveCerchia">Scollegati ed esci dalla Cerchia</button>
            </div>

            <hr style="width: 100%; border: 0; border-top: 1px solid #eee; margin: 5px 0;">

            <p style="font-size: 13px; text-align: center; margin: 0; color: #555;">Entra in una nuova cerchia:</p>
            <input type="text" id="initCerchiaInput" class="modal-input" placeholder="Codice Cerchia..." autocapitalize="characters" autocorrect="off" spellcheck="false">
            <button class="control-btn btn-sync" id="btnJoinInit" style="width: 100%;">Connetti</button>
            
            <div id="recentCerchieContainer" style="display: none; margin-top: 5px;">
                <p style="font-size: 13px; text-align: center; margin: 0 0 5px 0; color: #555;">Oppure accedi a una cerchia recente:</p>
                <div class="conflict-btn-group" id="recentCerchieList"></div>
            </div>
            
            <button class="btn-cancel" id="btnCloseInitModal" style="margin-top: 5px; background: #6c757d; color: white; border:none; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">Chiudi (Continua Offline)</button>
        </div>
    </div>

    <!-- MODALE TAPPE -->
    <div class="modal-overlay" id="noteModal">
        <div class="modal-content">
            <h3>Nuova Tappa</h3>
            <textarea id="noteText" placeholder="Descrizione del luogo..."></textarea>
            <label for="notePhoto" class="custom-file-upload">📷 Scatta o carica foto</label>
            <input type="file" id="notePhoto" accept="image/*" capture="environment">
            <div id="photoPreview"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelNoteBtn" style="background:#6c757d;">Annulla</button>
                <button class="btn-confirm" id="saveNoteBtn">Salva</button>
            </div>
        </div>
    </div>

    <!-- MODALE ARCHIVIO -->
    <div class="modal-overlay" id="archiveModal">
        <div class="modal-content">
            <h3>Archivio Percorsi</h3>
            <ul class="archive-list" id="archiveList"></ul>
            <div class="modal-buttons">
                <button class="btn-cancel" id="closeArchiveBtn" style="background:#6c757d;">Chiudi</button>
            </div>
        </div>
    </div>

    <div id="toastMsg"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <script>
        // --- 1. CONFIGURAZIONE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBnB_5Z8jbP22KLpiBkI9z6QLAy0O4yPBQ",
            authDomain: "driver-geo-max.firebaseapp.com",
            databaseURL: "https://driver-geo-max-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "driver-geo-max",
            storageBucket: "driver-geo-max.firebasestorage.app",
            messagingSenderId: "837223951164",
            appId: "1:837223951164:web:0516f9e6832f77d1ae8c39"
        };

        let db = null;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } 
        catch (e) { console.warn("Firebase offline"); }

        function sanitizeInput(input) { return (typeof input === 'string') ? input.replace(/[<>]/g, '').trim().substring(0, 500) : ''; }
        function sanitizeHtml(html) { return (typeof html === 'string') ? html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '') : ''; }

        function distanceToSegmentMeters(p, a, b) {
            const cosLat = Math.cos((p[0] * Math.PI) / 180);
            const P = { x: 0, y: 0 }, A = { x: (a[1] - p[1]) * cosLat * 111320, y: (a[0] - p[0]) * 110540 }, B = { x: (b[1] - p[1]) * cosLat * 111320, y: (b[0] - p[0]) * 110540 };
            const dx = B.x - A.x, dy = B.y - A.y;
            const len2 = dx * dx + dy * dy;
            if (len2 === 0) return Math.hypot(P.x - A.x, P.y - A.y);
            let t = Math.max(0, Math.min(1, ((P.x - A.x) * dx + (P.y - A.y) * dy) / len2));
            return Math.hypot(P.x - (A.x + t * dx), P.y - (A.y + t * dy));
        }

        // --- 2. SETUP MAPPA ---
        const map = L.map('map', { zoomControl: false }).setView([41.06, 16.92], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const dataLayerGroup = L.layerGroup().addTo(map);
        const tempLayerGroup = L.layerGroup().addTo(map);
        const userIcon = L.divIcon({ html: '<div class="blue-dot"></div>', className: '', iconSize: [22,22], iconAnchor: [11,11] });
        const destIcon = L.divIcon({ html: '🏁', className: 'flag-icon', iconSize: [30,30], iconAnchor: [15,30] });
        const noteIcon = L.divIcon({ html: '📌', className: 'flag-icon', iconSize: [30,30], iconAnchor: [15,30] });
        const blockIcon = L.divIcon({ html: '🚧', className: 'flag-icon', iconSize: [30,30], iconAnchor: [15,30] });

        let userMarker = null; let routingControl = null;
        let activeCerchia = localStorage.getItem('geoCerchia') || null;
        let recentCerchie = JSON.parse(localStorage.getItem('geoRecentCerchie') || '[]');
        let localRoutes = JSON.parse(localStorage.getItem('geoRoutes') || '[]');
        let localBlocks = JSON.parse(localStorage.getItem('geoBlocks') || '[]');
        let activeCerchiaRef = null; 
        
        let isRecording = false; let currentRoutePoints = []; let currentRouteNotes = []; let currentRouteLine = null;
        let blockMode = 0; let tempBlockStart = null; let tempBlockMarker = null;
        let isAddingNoteMode = false; let tempNoteLatLng = null; let tempNoteImage = null;

        document.getElementById('menuToggleBtn').addEventListener('click', () => document.getElementById('mainPanel').classList.toggle('active'));

        function showToast(msg, alert=false) {
            const t = document.getElementById('toastMsg');
            t.innerText = sanitizeInput(msg); t.className = alert ? 'alert show' : 'show';
            setTimeout(() => t.classList.remove('show'), alert ? 5000 : 3000);
        }

        // --- 3. MOTORE GPS OTTIMIZZATO ---
        let globalWatchId = null;
        let lastCheckTime = 0;

        function avviaLocalizzazioneGlobale() {
            if (!navigator.geolocation) return showToast("GPS non supportato", true);
            if (globalWatchId) return;

            globalWatchId = navigator.geolocation.watchPosition((pos) => {
                const latlng = [pos.coords.latitude, pos.coords.longitude];
                const now = Date.now();

                if (!userMarker) { 
                    userMarker = L.marker(latlng, { icon: userIcon }).addTo(map); 
                    map.setView(latlng, 16); 
                } else { 
                    userMarker.setLatLng(latlng); 
                }

                if (isRecording) {
                    let distance = 0;
                    if (currentRoutePoints.length > 0) {
                        const lastPt = currentRoutePoints[currentRoutePoints.length - 1];
                        distance = map.distance(latlng, lastPt);
                    }

                    if (currentRoutePoints.length === 0 || (distance >= 30 && distance < 2000)) {
                        currentRoutePoints.push(latlng); 
                        if(currentRouteLine) currentRouteLine.setLatLngs(currentRoutePoints);
                        map.panTo(latlng); 
                    }

                    if (now - lastCheckTime > 1000) {
                        lastCheckTime = now;
                        localBlocks.forEach(block => {
                            const distToBlock = distanceToSegmentMeters(latlng, block.start, block.end);
                            if (distToBlock < 15 && !block.notified) { 
                                showToast("⚠️ ATTENZIONE: STRADA INTERROTTA!", true); 
                                if (navigator.vibrate) navigator.vibrate([300, 150, 300]); 
                                block.notified = true; 
                            } else if (distToBlock > 50) { 
                                block.notified = false; 
                            }
                        });
                    }
                }
            }, () => showToast("Attiva il GPS per la localizzazione", true), { 
                enableHighAccuracy: true,
                maximumAge: 3000,
                timeout: 10000 
            });
        }
        
        // --- 4. RICERCA E NAVIGAZIONE (NOMINATIM & OSRM) ---
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            if (query.length < 3) { searchResults.style.display = 'none'; return; }
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&countrycodes=it`)
                .then(res => res.json()).then(data => {
                    searchResults.innerHTML = '';
                    if(data.length > 0) {
                        searchResults.style.display = 'block';
                        data.forEach(item => {
                            const li = document.createElement('li'); li.innerText = item.display_name.split(',').slice(0,3).join(',');
                            li.onclick = () => avviaNavigazione(item.lat, item.lon, li.innerText); searchResults.appendChild(li);
                        });
                    } else searchResults.style.display = 'none';
                });
            }, 400);
        });
        document.addEventListener('click', (e) => { if (!document.getElementById('searchContainer').contains(e.target)) searchResults.style.display = 'none'; });

        function avviaNavigazione(destLat, destLng, destName) {
            searchResults.style.display = 'none'; searchInput.value = destName; searchInput.blur(); document.getElementById('cancelNavBtn').style.display = 'block';
            if (!userMarker) return showToast("Attendo posizione GPS...", true);
            showToast("Calcolo percorso...");
            if (routingControl) map.removeControl(routingControl);
            routingControl = L.Routing.control({
                waypoints: [ userMarker.getLatLng(), L.latLng(destLat, destLng) ],
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
                lineOptions: { styles: [{ color: '#007bff', opacity: 0.8, weight: 6 }] }, showAlternatives: false, routeWhileDragging: false,
                createMarker: function(i, wp, nWps) { if (i === nWps - 1) return L.marker(wp.latLng, { icon: destIcon }); return null; }
            }).addTo(map);
        }

        document.getElementById('cancelNavBtn').addEventListener('click', () => {
            if (routingControl) map.removeControl(routingControl);
            document.getElementById('cancelNavBtn').style.display = 'none'; searchInput.value = ''; showToast("Navigazione terminata.");
        });

        // --- 5. CENTRALINO CERCHIE ---
        function renderCerchieUI() {
            const statusText = document.getElementById('currentCerchiaStatusText');
            const leaveBtnDiv = document.getElementById('leaveCerchiaDiv');
            const recentContainer = document.getElementById('recentCerchieContainer');
            const recentList = document.getElementById('recentCerchieList');
            const badge = document.getElementById('cerchiaBadge');

            if (activeCerchia) {
                statusText.innerText = activeCerchia; statusText.style.color = "#28a745";
                leaveBtnDiv.style.display = "flex";
                badge.innerText = `📡 ${activeCerchia}`; badge.style.background = "#28a745";
            } else {
                statusText.innerText = "Offline"; statusText.style.color = "#6c757d";
                leaveBtnDiv.style.display = "none";
                badge.innerText = "👤 Offline"; badge.style.background = "#6c757d";
            }

            recentList.innerHTML = '';
            const filteredRecent = recentCerchie.filter(c => c !== activeCerchia);
            if (filteredRecent.length > 0) {
                recentContainer.style.display = "block";
                filteredRecent.forEach(codice => {
                    const btn = document.createElement('button'); btn.className = "recent-cerchia-btn";
                    btn.innerHTML = `<span>👥 ${codice}</span> <span>Entra ➔</span>`;
                    btn.onclick = () => { document.getElementById('initModal').classList.remove('active'); avviaSincronizzazione(codice); avviaLocalizzazioneGlobale(); };
                    recentList.appendChild(btn);
                });
            } else { recentContainer.style.display = "none"; }
        }

        function saveRecentCerchia(codice) {
            recentCerchie = recentCerchie.filter(c => c !== codice); recentCerchie.unshift(codice);
            if(recentCerchie.length > 5) recentCerchie.pop(); localStorage.setItem('geoRecentCerchie', JSON.stringify(recentCerchie));
        }

        if (activeCerchia) { document.getElementById('initModal').classList.remove('active'); avviaSincronizzazione(activeCerchia); renderCerchieUI(); } 
        else { renderCerchieUI(); renderDatiLocali(); }

        document.getElementById('btnCloseInitModal').addEventListener('click', () => { document.getElementById('initModal').classList.remove('active'); if(!activeCerchia) impostaUIOffline(); avviaLocalizzazioneGlobale(); });
        document.getElementById('btnLeaveCerchia').addEventListener('click', () => { impostaUIOffline(); showToast("Sei uscito dalla cerchia. Modalità Offline."); });

        document.getElementById('btnJoinInit').addEventListener('click', () => {
            const codice = sanitizeInput(document.getElementById('initCerchiaInput').value.trim().toUpperCase());
            if (codice.length < 3) return showToast("Codice troppo corto!");
            document.getElementById('initModal').classList.remove('active'); document.getElementById('initCerchiaInput').value = '';
            avviaSincronizzazione(codice); avviaLocalizzazioneGlobale();
        });

        document.getElementById('joinCerchiaMenuBtn').addEventListener('click', () => { document.getElementById('mainPanel').classList.remove('active'); renderCerchieUI(); document.getElementById('initModal').classList.add('active'); });

        function impostaUIOffline() {
            if (activeCerchiaRef) { activeCerchiaRef.off(); activeCerchiaRef = null; }
            activeCerchia = null; localStorage.removeItem('geoCerchia'); renderCerchieUI(); renderDatiLocali();
        }

        function renderDatiLocali() {
            dataLayerGroup.clearLayers(); tempLayerGroup.clearLayers();
            localRoutes.forEach(r => renderRoute(r)); localBlocks.forEach(b => { b.notified = false; renderBlock(b); });
        }

        function renderRoute(route) {
            L.polyline(route.points, { color: 'purple', weight: 4, opacity: 0.8 }).addTo(dataLayerGroup).bindPopup(sanitizeHtml(`<b>${sanitizeInput(route.name)}</b>`));
            if (route.notes) route.notes.forEach(n => {
                let c = `<b>${sanitizeInput(n.text || 'Tappa')}</b>`; if (n.image) c += `<br><img src="${sanitizeInput(n.image)}">`;
                L.marker([n.lat, n.lng], { icon: noteIcon }).addTo(dataLayerGroup).bindPopup(sanitizeHtml(c));
            });
        }

        function renderBlock(block) {
            const line = L.polyline([block.start, block.end], { color: 'red', weight: 5, dashArray: '10, 10' }).addTo(dataLayerGroup);
            const m1 = L.marker(block.start, { icon: blockIcon }).addTo(dataLayerGroup); const m2 = L.marker(block.end, { icon: blockIcon }).addTo(dataLayerGroup);
            const html = `<b>🚧 Interruzione</b><br><button class="popup-del-btn" onclick="deleteBlock('${block.id||''}', ${block.start[0]}, ${block.start[1]})">🟢 Riapri</button>`;
            line.bindPopup(html); m1.bindPopup(html); m2.bindPopup(html);
        }

        function avviaSincronizzazione(codice) {
            if (!db) { impostaUIOffline(); avviaLocalizzazioneGlobale(); return showToast("Offline mode.", true); }
            if (activeCerchiaRef) { activeCerchiaRef.off(); activeCerchiaRef = null; }
            activeCerchia = codice; localStorage.setItem('geoCerchia', codice); saveRecentCerchia(codice); renderCerchieUI(); showToast("Sincronizzazione..."); avviaLocalizzazioneGlobale();
            
            db.ref('cerchie/' + activeCerchia).once('value').then(snapshot => {
                const cloudData = snapshot.val() || { blocks: {}, routes: {} }; localBlocks = []; localRoutes = [];
                Object.entries(cloudData.blocks || {}).forEach(([id, val]) => { val.id = id; localBlocks.push(val); });
                Object.entries(cloudData.routes || {}).forEach(([id, val]) => { val.id = id; localRoutes.push(val); });
                localStorage.setItem('geoBlocks', JSON.stringify(localBlocks)); localStorage.setItem('geoRoutes', JSON.stringify(localRoutes));
                attivaAscoltoLive(); showToast(`Connesso a: ${codice}`);
            }).catch(() => { impostaUIOffline(); showToast("Errore rete. Offline.", true); });
        }

        function attivaAscoltoLive() {
            renderDatiLocali(); activeCerchiaRef = db.ref('cerchie/' + activeCerchia);
            activeCerchiaRef.child('routes').on('child_added', s => { const r = s.val(); r.id = s.key; if (!localRoutes.some(x => x.id === r.id)) { localRoutes.push(r); localStorage.setItem('geoRoutes', JSON.stringify(localRoutes)); renderRoute(r); } });
            activeCerchiaRef.child('routes').on('child_removed', s => { localRoutes = localRoutes.filter(r => r.id !== s.key); localStorage.setItem('geoRoutes', JSON.stringify(localRoutes)); renderDatiLocali(); });
            activeCerchiaRef.child('blocks').on('child_added', s => { const b = s.val(); b.id = s.key; if (!localBlocks.some(x => x.id === b.id)) { b.notified = false; localBlocks.push(b); localStorage.setItem('geoBlocks', JSON.stringify(localBlocks)); renderBlock(b); } });
            activeCerchiaRef.child('blocks').on('child_removed', s => { localBlocks = localBlocks.filter(b => b.id !== s.key); localStorage.setItem('geoBlocks', JSON.stringify(localBlocks)); renderDatiLocali(); });
        }

        // --- 6. AZIONI UTENTE (Disegno, Tappe, Blocchi) ---
        map.on('click', (e) => {
            document.getElementById('mainPanel').classList.remove('active');
            if (isAddingNoteMode) {
                tempNoteLatLng = e.latlng; document.getElementById('noteText').value = ''; document.getElementById('notePhoto').value = '';
                document.getElementById('photoPreview').innerHTML = ''; tempNoteImage = null; document.getElementById('noteModal').classList.add('active'); isAddingNoteMode = false;
            } 
            else if (blockMode === 1) { 
                tempBlockStart = e.latlng; tempBlockMarker = L.marker(tempBlockStart, { icon: blockIcon }).addTo(map); blockMode = 2; showToast("Tocca la FINE dell'interruzione 🚧"); 
            } 
            else if (blockMode === 2) {
                const newBlock = { start: [tempBlockStart.lat, tempBlockStart.lng], end: [e.latlng.lat, e.latlng.lng] };
                if (activeCerchia && db) db.ref('cerchie/' + activeCerchia + '/blocks').push(newBlock);
                else { localBlocks.push(newBlock); localStorage.setItem('geoBlocks', JSON.stringify(localBlocks)); renderBlock(newBlock); }
                blockMode = 0; tempBlockStart = null; document.getElementById('cancelBlockBtn').style.display = 'none'; if (tempBlockMarker) map.removeLayer(tempBlockMarker);
            }
        });

        document.getElementById('addNoteBtn').addEventListener('click', () => { isAddingNoteMode = true; document.getElementById('mainPanel').classList.remove('active'); showToast("Tocca la mappa per la tappa 📍"); });
        document.getElementById('cancelNoteBtn').addEventListener('click', () => { document.getElementById('noteModal').classList.remove('active'); });
        
        document.getElementById('notePhoto').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file || !file.type.match('image.*')) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); const w = 400, h = Math.round((img.height * 400) / img.width);
                    canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    tempNoteImage = canvas.toDataURL('image/jpeg', 0.6); document.getElementById('photoPreview').innerHTML = `<img src="${tempNoteImage}">`;
                }; img.src = evt.target.result;
            }; reader.readAsDataURL(file);
        });

        document.getElementById('saveNoteBtn').addEventListener('click', () => {
            const text = sanitizeInput(document.getElementById('noteText').value);
            if ((text !== '' || tempNoteImage) && tempNoteLatLng) {
                currentRouteNotes.push({ lat: tempNoteLatLng.lat, lng: tempNoteLatLng.lng, text, image: tempNoteImage });
                L.marker(tempNoteLatLng, { icon: noteIcon }).addTo(tempLayerGroup); showToast("Tappa salvata!");
            }
            document.getElementById('noteModal').classList.remove('active');
        });

        document.getElementById('blockRoadBtn').addEventListener('click', () => { blockMode = 1; document.getElementById('cancelBlockBtn').style.display = 'block'; document.getElementById('mainPanel').classList.remove('active'); showToast("Tocca l'INIZIO interruzione 🚧"); });
        document.getElementById('cancelBlockBtn').addEventListener('click', () => { blockMode = 0; tempBlockStart = null; if (tempBlockMarker) map.removeLayer(tempBlockMarker); document.getElementById('cancelBlockBtn').style.display = 'none'; showToast("Annullato."); });
        
        window.deleteBlock = function(id, lat, lng) {
            if (confirm("Riaprire questa strada?")) {
                if (activeCerchia && db && id) db.ref('cerchie/' + activeCerchia + '/blocks/' + id).remove();
                else { localBlocks = localBlocks.filter(b => b.start[0] !== lat); localStorage.setItem('geoBlocks', JSON.stringify(localBlocks)); renderDatiLocali(); }
            }
        };

        const recordBtn = document.getElementById('recordRouteBtn');
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                isRecording = true; recordBtn.innerText = "⏹️ Ferma e Salva"; recordBtn.classList.replace('btn-record', 'btn-stop'); document.getElementById('mainPanel').classList.remove('active');
                currentRoutePoints = []; currentRouteNotes = []; currentRouteLine = L.polyline([], { color: '#007bff', weight: 4 }).addTo(map);
                if (userMarker) { currentRoutePoints.push([userMarker.getLatLng().lat, userMarker.getLatLng().lng]); currentRouteLine.setLatLngs(currentRoutePoints); map.setView(userMarker.getLatLng()); }
            } else {
                isRecording = false; recordBtn.innerText = "🔴 Registra Percorso"; recordBtn.classList.replace('btn-stop', 'btn-record');
                if (currentRouteLine) map.removeLayer(currentRouteLine); tempLayerGroup.clearLayers();
                if (currentRoutePoints.length > 1) {
                    const name = sanitizeInput(prompt("Nome del percorso:", "Nuovo Viaggio"));
                    if (name) {
                        const r = { name, points: currentRoutePoints, notes: currentRouteNotes };
                        if (activeCerchia && db) db.ref('cerchie/' + activeCerchia + '/routes').push(r);
                        else { localRoutes.push(r); localStorage.setItem('geoRoutes', JSON.stringify(localRoutes)); renderRoute(r); }
                    }
                }
            }
        });

        // --- 7. ARCHIVIO ---
        document.getElementById('openArchiveBtn').addEventListener('click', () => { document.getElementById('mainPanel').classList.remove('active'); renderArchiveUI(); document.getElementById('archiveModal').classList.add('active'); });
        document.getElementById('closeArchiveBtn').addEventListener('click', () => { document.getElementById('archiveModal').classList.remove('active'); });
        
        function renderArchiveUI() {
            const list = document.getElementById('archiveList'); list.innerHTML = '';
            if (localRoutes.length === 0) return list.innerHTML = '<p style="text-align:center;">Nessun percorso.</p>';
            localRoutes.forEach((r, i) => { const li = document.createElement('li'); li.className = 'archive-item'; li.innerHTML = `<span><b>${sanitizeInput(r.name)}</b></span> <button class="delete-btn" onclick="deleteRoute(${i})">Elimina</button>`; list.appendChild(li); });
        }
        window.deleteRoute = function(i) {
            if (confirm("Rimuovere il percorso?")) {
                const r = localRoutes[i];
                if (activeCerchia && db && r.id) db.ref('cerchie/' + activeCerchia + '/routes/' + r.id).remove();
                else { localRoutes.splice(i, 1); localStorage.setItem('geoRoutes', JSON.stringify(localRoutes)); renderDatiLocali(); renderArchiveUI(); }
            }
        };
    </script>
</body>
</html>
